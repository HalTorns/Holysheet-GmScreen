name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Validation — Holysheet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
          cache: true
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Refuser les vulnérabilités importantes des dépendances de production
        run: pnpm audit --prod --audit-level=high
      - name: Initialiser PostgreSQL 18, Convex, dashboard et Mailpit locaux
        run: pnpm setup
      - name: Vérifier la configuration locale sans afficher les secrets
        run: pnpm run doctor
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Vérifier types, Oxlint, Oxfmt, Knip, Vitest navigateur et build
        run: pnpm check
      - name: Parcours Holysheet et sécurité HTTP sur le serveur construit
        run: pnpm test:e2e:ci tests/e2e/holysheet.spec.ts
      - name: Arrêter les services
        if: always()
        run: pnpm services:down

  secrets:
    name: Secrets dans l’historique
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout complet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rechercher les secrets avec sorties masquées
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact=100 --no-banner --log-opts="--all" /repo

  docker-image:
    name: Image Docker de production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire l'étape finale avec des URL publiques factices
        run: >-
          docker build --target production -t holysheet-ci --build-arg VITE_SITE_URL=https://ci.example.test --build-arg VITE_CONVEX_URL=https://convex.ci.example.test --build-arg VITE_CONVEX_SITE_URL=https://convex-site.ci.example.test .
      - name: Vérifier la version de Node de l'image
        run: |
          expected="v$(cat .node-version)"
          actual="$(docker run --rm --entrypoint node holysheet-ci --version)"
          echo "Node attendu $expected, image $actual"
          test "$actual" = "$expected"
      - name: Démarrer l'image et vérifier /robots.txt
        run: |
          docker run -d --name holysheet-ci -p 3000:3000 holysheet-ci
          expected='Sitemap: https://ci.example.test/sitemap.xml'
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            status="$(curl -sS --max-time 5 -o robots.txt -w '%{http_code}' http://127.0.0.1:3000/robots.txt || true)"
            if [[ "$status" == 200 ]] && grep -Fxq "$expected" robots.txt; then
              cat robots.txt
              exit 0
            fi
            sleep 1
          done
          echo "Aucune réponse 200 conforme de /robots.txt en 60 s (dernier statut : ${status:-aucun})"
          exit 1
      - name: Journaux et arrêt du conteneur
        if: always()
        run: |
          docker logs holysheet-ci 2>&1 | tail -50 || true
          docker rm -f holysheet-ci || true
