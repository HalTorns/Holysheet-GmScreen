name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Validation — ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: personal
            label: Personnel
            organizations: 'false'
          - mode: organizations
            label: Organisations
            organizations: 'true'
    env:
      PLAYWRIGHT_EXPECT_ORGANIZATIONS: ${{ matrix.organizations }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.0
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
          cache: true
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Refuser les vulnérabilités importantes des dépendances de production
        run: pnpm audit --prod --audit-level=high
      - name: Initialiser Convex, dashboard et Mailpit locaux
        run: pnpm setup
      - name: Vérifier la configuration locale sans afficher les secrets
        run: pnpm doctor
      - name: Vérifier types, lint, format, tests et build
        run: pnpm check
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours complets en mode personnel
        if: matrix.mode == 'personal'
        run: pnpm test:e2e:ci
      - name: Parcours complets en mode organisations
        if: matrix.mode == 'organizations'
        run: pnpm test:e2e:organizations --all
      - name: Arrêter les services
        if: always()
        run: pnpm services:down

  secrets:
    name: Secrets dans l’historique
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout complet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rechercher les secrets avec sorties masquées
        run: >-
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner --log-opts="--all" /repo
