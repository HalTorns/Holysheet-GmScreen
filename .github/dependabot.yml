version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      auth:
        patterns:
          - better-auth
          - auth
          - '@better-auth/*'
          - '@convex-dev/better-auth'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
